name: Domain tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  domain-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select the latest Xcode
        run: sudo xcode-select --switch "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Run Domain tests
        working-directory: Packages/BabyCore
        run: swift test --filter DomainTests
